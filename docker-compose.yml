version: '3.8'

services:
  portfolio-backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/portfolio
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data: 